<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knights Prep staff email signature</title>
<style>
  :root {
    --navy: #001941;
    --gold: #ac874f;
    --page: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--page);
    color: var(--navy);
    font-family: Calibri, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 480px;
    padding-left: 20px;
    border-left: 4px solid var(--gold);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.75rem;
    line-height: 1.2;
  }
  p {
    margin: 0 0 24px;
    font-size: 1.05rem;
    max-width: 60ch;
  }
  .button {
    display: inline-block;
    padding: 12px 24px;
    background: var(--navy);
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 4px;
  }
  .button:hover { background: #0a2d63; }
  .button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>Staff email signature</h1>
    <p>Open the signature, press Ctrl+A then Ctrl+C to copy it, and paste it into your Outlook signature box.</p>
    <a class="button" href="knights_signature_V2.html">Open the signature</a>
  </main>
</body>
</html>
